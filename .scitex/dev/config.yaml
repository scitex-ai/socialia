# scitex-dev project-type config
# socialia carries a content-tree style root layout
# (`drafts/`, `projects/`, `INSTRUCTIONS.md`). PS-103 is skipped
# under `special`; every other PS rule still applies via `pip`.

project-type:
  - pip
  - special

audit:
  # NOTE: `audit.enforce-logging` is RETIRED (scitex-logging owns PS-220
  # as mandatory error tier with no severity switch) — do NOT re-add it;
  # the declaration itself is flagged. The 313-site print migration is
  # done in-tree instead (this PR).

  # Debt deferrals (sanctioned `audit.skip-rules`, one rationale each).
  # All below are pre-existing on develop and land as a whole-package
  # overhaul, not piecemeal inside socialia#62 (2026-10-17).
  skip-rules:
    PS-106: "README coverage badge; lands with the README-template overhaul."
    PS-107: "README H2 sections (Interfaces, Part of SciTeX); README overhaul."
    PS-108: "Flat src/socialia/ layout (18 files over threshold); src reorg wave (see PS-108 hint: piecemeal moves leave the tree half-organized)."
    PS-108b: "Same root cause as PS-108; fixed by the same src reorg wave."
    PS-109: "README PyPI version badge; README overhaul."
    PS-110: "README Four-Freedoms blockquote; README overhaul."
    PS-112: "README logo image; README overhaul."
    PS-116: "README deprecated Interfaces callout; README overhaul."
    PS-121: "rtd-onboarding bundle missing; one coherent rtd-onboarding PR (in-wheel docs served by scitex-cloud)."
    PS-128: ".gitignore excludes _sphinx_html; same rtd-onboarding PR (bundle must be tracked)."
    PS-201: "tests/ lacks tests/socialia/ parent; test-tree mirror migration (rename + fill dirs as one commit)."
    PS-203: "Loose top-level tests; same test-tree mirror migration."
    PS-231: "Leaf workflows duplicate org reusables; conversion deferred — rtd workflow vendors the in-wheel _sphinx_html bundle the reusable cannot express (BUILD-ONLY), quality workflow runs this same audit-all. Revisit with the overhaul."
    PS-501: "examples/ mains lack @stx.session; example overhaul wave."
    "§1a": "CLI ships _skills/ but no skills list/get/install command group; CLI overhaul alongside the src reorg."
    "§1": "post/thread/feed read as nouns; they are the published CLI command verbs and renaming breaks the CLI surface. Moby tags them both ways; in this CLI the verb reading is intended. Revisit with the CLI overhaul (same escape hatch `next` uses: cli-audit-dict.yaml)."
    "§2": "Single-token `usage` MCP tool; renamed to verb_noun in the MCP/Python-API parity wave."
    "§10": "Cold-start 1438ms over the 500ms budget (heavy platform clients imported eagerly); PEP 562 lazy-import wave."
    "§5": "MCP skills_list/skills_get tools missing; MCP/Python-API parity wave."
    "§6": "8 MCP tools without matching Python APIs (mixed export-only vs genuinely missing); parity wave designs real signatures instead of re-exporting transport-shaped wrappers."
    PA-306: "audit-python-apis findings under the current corpus; same parity wave as §6."
    PA-307: "audit-python-apis findings under the current corpus; same parity wave as §6."
