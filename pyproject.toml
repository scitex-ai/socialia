[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socialia"
version = "0.5.15"
description = "Unified social media management - posting, analytics, and insights"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [
    {name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}
]
keywords = ["social-media", "twitter", "cli", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "scitex-config>=0.3.0",
    "scitex-dev>=0.11.7",
    "scitex-logging>=0.1.0",
    "requests-oauthlib>=1.3.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "argcomplete>=3.0.0",
    "click>=8.0",
]

[project.optional-dependencies]
reddit = ["praw>=7.7.0"]
mcp = ["fastmcp>=2.0.0", "scitex-dev[mcp]>=0.11.7"]
analytics = ["google-analytics-data>=0.18.0"]
youtube = ["google-api-python-client>=2.100.0", "google-auth-oauthlib>=1.1.0"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
dev = [
    "google-analytics-data>=0.18.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "mcp>=1.0.0",
    "praw>=7.7.0",
    "pytest",
    # pytest-cov is required by the CI's `pytest --cov=src/socialia` invocation
    # (see .github/workflows/pytest-matrix-on-ubuntu-py3-11-3-12-3-13.yml).
    "pytest-cov",
    # pytest-randomly enforces order-independence per the SciTeX migration
    # playbook (general/05_development_09_ecosystem-tq-migration.md).
    "pytest-randomly",
    "ruff",
    "scitex-dev>=0.11.7",
    "socialia[docs]",
]
all = ["socialia[docs]", "praw>=7.7.0", "mcp>=1.0.0", "google-analytics-data>=0.18.0", "google-api-python-client>=2.100.0", "google-auth-oauthlib>=1.1.0", "fastmcp>=2.0.0", "scitex-dev[mcp]>=0.11.7"]

[project.scripts]
socialia = "socialia.cli:main"

[project.entry-points."scitex_dev.docs"]
socialia = "socialia"

[project.entry-points."scitex_dev.skills"]
socialia = "socialia"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/socialia"
Repository = "https://github.com/ywatanabe1989/socialia"
Documentation = "https://socialia.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
socialia = ["_skills/**/*.md", "_sphinx_html/**/*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.coverage.run]
parallel = true
source = ["socialia"]
concurrency = ["multiprocessing", "thread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: fast subprocess-driven CLI happy-path tests (<60s)",
    "e2e: slow end-to-end workflows against real subsystems (RUN_E2E=1)",
]
