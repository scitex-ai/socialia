name: CLA Assistant

# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers/permissions preserved verbatim from the prior local file.
# Reusable workflow defaults (owner_login=ywatanabe1989,
# owner_allowlist="bot*,ywatanabe1989", default_branch=main) already match
# this repo's prior hardcoded values, so no `with:` overrides are needed.
#
# CAVEAT (pre-existing, not introduced by this migration): the prior local
# file referenced `secrets.CLA_PERSONAL_ACCESS_TOKEN` for the CLAssistant
# action's PERSONAL_ACCESS_TOKEN — this repo has NO secret by that name
# (`gh secret list` shows only CLAUDE_CODE_CREDENTIALS_JSON and
# PERSONAL_ACCESS_TOKEN). The reusable workflow instead references
# `secrets.GH_PERSONAL_ACCESS_TOKEN`, which ALSO does not exist on this
# repo today. Either way the CLAssistant action's PAT-backed write to the
# `cla-signatures` branch is already broken pre-migration; this diff does
# not fix or worsen it. Add a `GH_PERSONAL_ACCESS_TOKEN` repo secret
# (matching the other 4 repos in this batch) to make CLA signing work.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    secrets: inherit
